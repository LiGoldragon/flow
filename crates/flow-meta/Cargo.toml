[package]
name = "flow-meta"
version.workspace = true
edition.workspace = true
build = "build.rs"
[features]
default = ["datom"]
datom = []
[[bin]]
name = "flow-nexus-meta"
path = "src/main.rs"
[dependencies]
flow-ethos = { path = "../flow-ethos", features = ["datom"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4" }
meta-signal-flow = { workspace = true, features = ["datom"] }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3" }
rkyv.workspace = true
signal-flow.workspace = true
[dev-dependencies]
tempfile = "3"
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "07714b0171802787bea1eefe4caa2d826d9c4030" }
