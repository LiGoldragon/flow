[workspace]
members = ["crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.10.5"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "83171f3f39f53fbcff1a5fdc9bc7c96d6f57ac1f" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "29ec97d854acfc08ff1aba2813cd0957174901b1" }
