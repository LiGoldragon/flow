[package]
name = "flow-nexus"
version.workspace = true
build = "build.rs"
edition.workspace = true
[[bin]]
name = "flow-nexus-daemon"
path = "src/main.rs"
[features]
default = ["datom"]
datom = []
executable-default-configuration = []
[dependencies]
flow = { path = "../flow" }
flow-defaults = { path = "../flow-defaults" }
flow-native = { path = "../flow-native" }
flow-ethos.workspace = true
flow-ethos-before-request-ids = { path = "../flow-ethos-before-request-ids", features = ["datom"] }
signal-flow-before-request-ids = { path = "../signal-flow-before-request-ids", features = ["datom"] }
meta-signal-flow-before-request-ids = { path = "../meta-signal-flow-before-request-ids", features = ["datom"] }
base64 = "0.22"
# The Nexus renders one typed value as text, the Message it types into a
# pane (F6: Flow textualizes the letter so its Priority head comes first).
# That one exception is why the Nexus compiles its meta contract with datom.
meta-signal-flow = { workspace = true, features = ["datom"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
notify = "8"
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "time"] }
rkyv.workspace = true
redb = "4"
# The Sema kernel 0.1.1 at 51d7927: its repository was renamed memory, and
# github.com/LiGoldragon/sema now holds another project.
sema = { git = "https://github.com/LiGoldragon/memory", rev = "51d7927c872f0df12791bad8d39a4db6433b01a1" }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine", rev = "6a95a0925c9e6a6a144037ffdbad8c7d3cc126f2" }
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
signal-flow.workspace = true
tempfile = "3"
getrandom = "0.3"
thiserror.workspace = true
tungstenite = "0.28"
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "1976e45" }
[dev-dependencies]
message-nexus = { git = "https://github.com/LiGoldragon/message", rev = "c3d519d" }
# Both contracts with datom, as Message's CLIs build them and the build
# base's set holds them, so each has one build and its optional
# dependencies resolve here. The joint test reads only signal-message.
signal-message = { git = "https://github.com/LiGoldragon/signal-message", rev = "2999252", features = ["datom"] }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "b9b6a5b", features = ["datom"] }
# The Flow contracts Message 0.23.1 speaks, signal-flow 58.0.2 and
# meta-signal-flow 73.0.3: the joint test writes and reads Message's frames
# in them, while Flow speaks 59.0.0 and 74.0.0, whose earlier variants keep
# their places. With datom, as the build base's set holds them, so each has
# one build and its optional dependencies resolve here.
signal-flow-message = { package = "signal-flow", git = "https://github.com/LiGoldragon/signal-flow", rev = "15790be", features = ["datom"] }
meta-signal-flow-message = { package = "meta-signal-flow", git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "5f90d4c", features = ["datom"] }
