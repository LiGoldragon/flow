[package]
name = "flow-nexus"
version.workspace = true
build = "build.rs"
edition.workspace = true
[[bin]]
name = "flow-nexus"
path = "src/main.rs"
[features]
default = ["datom"]
datom = []
executable-default-configuration = []
[dependencies]
flow = { path = "../flow" }
flow-defaults = { path = "../flow-defaults" }
flow-native = { path = "../flow-native" }
flow-ethos.workspace = true
flow-ethos-before-request-ids = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "85bf0f1be9997ed2b1c46a8814750a77704ea40f" }
signal-flow-before-request-ids = { package = "signal-flow", git = "https://github.com/LiGoldragon/signal-flow", rev = "3596923778f452b141a6af57f0aebf470ff9d926" }
meta-signal-flow-before-request-ids = { package = "meta-signal-flow", git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "b36597a8b18b97b9f97f7702535399b57e3108aa" }
base64 = "0.22"
# The Nexus renders one typed value as text, the Message it types into a
# pane (F6: Flow textualizes the letter so its Priority head comes first).
# That one exception is why the Nexus compiles its meta contract with datom.
meta-signal-flow = { workspace = true, features = ["datom"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3" }
notify = "8"
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "time"] }
rkyv.workspace = true
redb = "4"
sema = { git = "https://github.com/LiGoldragon/sema", rev = "51d7927c872f0df12791bad8d39a4db6433b01a1" }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine", rev = "6a95a0925c9e6a6a144037ffdbad8c7d3cc126f2" }
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
signal-flow.workspace = true
tempfile = "3"
getrandom = "0.3"
thiserror.workspace = true
tungstenite = "0.28"
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "07714b0171802787bea1eefe4caa2d826d9c4030" }
