[package]
name = "flow-nexus"
version.workspace = true
build = "build.rs"
edition.workspace = true
[[bin]]
name = "flow-nexus"
path = "src/main.rs"
[dependencies]
flow-defaults = { path = "../flow-defaults" }
base64 = "0.22"
# The Nexus renders one typed value as text, the Message it types into a
# pane (F6: Flow textualizes the letter so its Priority head comes first).
# That one exception is why the Nexus compiles its meta contract with datom.
meta-signal-flow = { workspace = true, features = ["datom"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
notify = "8"
rustix = { version = "1", features = ["net", "time"] }
rkyv.workspace = true
redb = "4"
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine", rev = "516f01fe0b03157efc6cc3d38b588f0ca123ac94" }
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
signal-flow.workspace = true
thiserror.workspace = true
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c2653dd82adbdb1f1f2f654405c6620e0d06fd58" }
[dev-dependencies]
tempfile = "3"
