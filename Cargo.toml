[workspace]
members = ["crates/flow-defaults", "crates/flow-ethos", "crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.25.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "068f0eae1de5bf271f546e0dbfcb1f84c460263f" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "88f37592f29a792024be0b30fccc914277d2dcac" }
