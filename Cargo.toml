[workspace]
members = ["crates/flow-defaults", "crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.24.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "f95034de0b203d886ba574fcb513c691c64b8498" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "54eb5618e1433b68520ba9644e0428ea0f9ed75d" }
