[package]
name = "flow-nexus"
version.workspace = true
build = "build.rs"
edition.workspace = true
[[bin]]
name = "flow-nexus-daemon"
path = "src/main.rs"
[features]
default = ["datom"]
datom = []
[dependencies]
flow = { path = "../flow" }
flow-defaults = { path = "../flow-defaults" }
flow-native = { path = "../flow-native" }
flow-ethos.workspace = true
flow-place = { path = "../flow-place" }
flow-ethos-before-request-ids = { path = "../flow-ethos-before-request-ids", features = ["datom"] }
signal-flow-before-request-ids = { path = "../signal-flow-before-request-ids", features = ["datom"] }
meta-signal-flow-before-request-ids = { path = "../meta-signal-flow-before-request-ids", features = ["datom"] }
base64 = "0.22"
# The Nexus renders one typed value as text, the Message it types into a
# pane (F6: Flow textualizes the letter so its Priority head comes first).
# That one exception is why the Nexus compiles its meta contract with datom.
meta-signal-flow = { workspace = true, features = ["datom"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
notify = "8"
# The shared Place every Nexus starts in, and its place file, read before
# any socket opens (translator 0.6.0); text and unix are the edges the build
# base's feature set gives it.
translator = { git = "https://github.com/LiGoldragon/translator", rev = "6892a15b11653a2ef8932a4390b34f5e81583744", features = ["text", "unix"] }
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "time"] }
rkyv.workspace = true
redb = "4"
# The Sema kernel 0.1.1 at 51d7927: its repository was renamed memory, and
# github.com/LiGoldragon/sema now holds another project.
sema = { git = "https://github.com/LiGoldragon/memory", rev = "51d7927c872f0df12791bad8d39a4db6433b01a1" }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine", rev = "6a95a0925c9e6a6a144037ffdbad8c7d3cc126f2" }
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
signal-flow.workspace = true
# Curriculum's wire: the frames Flow asks the Curriculum Nexus for a launch's context.
signal-curriculum-nexus = { git = "https://github.com/LiGoldragon/signal-curriculum-nexus", rev = "4202d8b", features = ["datom"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
tempfile = "3"
getrandom = "0.3"
thiserror.workspace = true
tungstenite = "0.28"
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "f23eacf" }
[dev-dependencies]
# The published signal-flow 60, whose peers the ordinary greeting refuses and
# whose launch outcomes the 0.54.7 Memory step upgrades from.
signal-flow-60 = { package = "signal-flow", git = "https://github.com/LiGoldragon/signal-flow", rev = "04a72fd", features = ["datom"] }
# The published meta-signal-flow 77, whose peers the meta greeting refuses.
meta-signal-flow-77 = { package = "meta-signal-flow", git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "e72f5552816477e1acfaab6cd7515bc5f807edff", features = ["datom"] }
