[workspace]
members = ["crates/flow-defaults", "crates/flow-native", "crates/flow-ethos", "crates/flow-ethos-before-request-ids", "crates/signal-flow-before-request-ids", "crates/meta-signal-flow-before-request-ids", "crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.54.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
# Without default features, as signal-flow and meta-signal-flow take it, so
# the build base's signal-flow and the members link one flow-ethos build.
flow-ethos = { path = "crates/flow-ethos", default-features = false, features = ["datom"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "15790be" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "5f90d4c" }

# Signal and Meta-Signal also depend on flow-ethos by this Git source. Resolve
# those workspace edges to this exact leaf package so every shared nominal
# type has one Cargo package identity during the Flow workspace build.
[patch."https://github.com/LiGoldragon/flow"]
flow-ethos = { path = "crates/flow-ethos" }

# sema-engine names the Sema kernel by its old repository URL, which no
# longer holds commit 51d7927. Resolve that edge to the same commit in the
# renamed repository, so sema-engine and flow-nexus share one sema package.
[patch."https://github.com/LiGoldragon/sema.git"]
sema = { git = "https://github.com/LiGoldragon/memory", rev = "51d7927c872f0df12791bad8d39a4db6433b01a1" }
