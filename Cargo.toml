[workspace]
members = ["crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "1a8bb198642ac0cad5b99f4926283efae81a3a8b" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "c61099aa77471872cd13cc317d4ca42d1e0dee1c" }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "2abec17849fe270755bb04a13d052e1edbb2a7ab" }
