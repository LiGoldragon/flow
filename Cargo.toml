[workspace]
members = ["crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.12.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "74a47edc39a94e39cfbe7f4619340f257b11cecd" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "fbfe8970247d57e9299e496e89d1845df991c73d" }
