[workspace]
members = ["crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "afcdf076a71263460ef039fac7600ea1310a9707" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "fcf0a0b24549aee6f505f33e5f86b6ce9a4cff25" }
