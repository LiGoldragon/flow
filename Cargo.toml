[workspace]
members = ["crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "edfea8712513bd6e7323872c6aacc058bcc51304" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "71e92386ac0318485ce7eb3bbfab250ad44c68b3" }
meta-signal-lojix = { git = "https://github.com/LiGoldragon/meta-signal-lojix.git", rev = "45c51112824b487ae3a8e3e5b05cd372b6619481" }
signal-lojix = { git = "https://github.com/LiGoldragon/signal-lojix.git", rev = "50c4fab3f8a2b16aa1261104395f1dae315035d1" }
