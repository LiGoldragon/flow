[package]
name = "flow"
version.workspace = true
edition.workspace = true
build = "build.rs"
[features]
default = ["datom"]
datom = []
[[bin]]
name = "flow-nexus"
path = "src/main.rs"
[[bin]]
name = "flow-nexus-hook"
path = "src/hook.rs"
[dependencies]
flow-ethos = { path = "../flow-ethos", default-features = false, features = ["datom"] }
flow-native = { path = "../flow-native" }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
rkyv.workspace = true
serde_json.workspace = true
signal-flow = { workspace = true, features = ["datom"] }
[dev-dependencies]
tempfile = "3"
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "f23eacf" }
