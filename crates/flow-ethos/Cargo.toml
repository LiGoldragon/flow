[package]
name = "flow-ethos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "0bbeb11", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "4024614", optional = true }
rkyv.workspace = true

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "07714b0171802787bea1eefe4caa2d826d9c4030" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
