[package]
name = "flow-nexus"
version.workspace = true
build = "build.rs"
edition.workspace = true
[[bin]]
name = "flow-nexus"
path = "src/main.rs"
[features]
default = ["datom"]
datom = []
[dependencies]
flow-defaults = { path = "../flow-defaults" }
flow-ethos.workspace = true
base64 = "0.22"
# The Nexus renders one typed value as text, the Message it types into a
# pane (F6: Flow textualizes the letter so its Priority head comes first).
# That one exception is why the Nexus compiles its meta contract with datom.
meta-signal-flow = { workspace = true, features = ["datom"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
notify = "8"
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "time"] }
rkyv.workspace = true
redb = "4"
sema = { git = "https://github.com/LiGoldragon/sema", rev = "51d7927c872f0df12791bad8d39a4db6433b01a1" }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine", rev = "9884905ff9c660ad97a35c524e42532d5c7bac90" }
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
signal-flow.workspace = true
thiserror.workspace = true
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "ac10f9e8673592f55feed6f71491d44ec8613a34" }
[dev-dependencies]
tempfile = "3"
