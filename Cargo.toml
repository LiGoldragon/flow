[workspace]
members = ["crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "8e821aff47650f55d7190a1ce43aa9e0b37d947e" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "465577e2fd327fbf0950849e7a16322a436818a3" }
