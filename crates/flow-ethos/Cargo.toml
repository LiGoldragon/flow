[package]
name = "flow-ethos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
# Cargo tells a git source by its rev string: protos, datom-codec and
# ethos-zero are pinned by the strings their other consumers write, so one
# source of each stands in the graph.
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
rkyv.workspace = true

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "1976e45" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
