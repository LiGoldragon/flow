[package]
name = "flow-meta"
version.workspace = true
edition.workspace = true
build = "build.rs"
[features]
default = ["datom"]
datom = []
[[bin]]
name = "flow-meta"
path = "src/main.rs"
[[bin]]
name = "flow-meta-compose-invocation"
path = "src/compose_invocation.rs"
[dependencies]
flow-ethos = { path = "../flow-ethos", features = ["datom"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
meta-signal-flow = { workspace = true, features = ["datom"] }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
rkyv.workspace = true
signal-flow.workspace = true
[dev-dependencies]
tempfile = "3"
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "07714b0171802787bea1eefe4caa2d826d9c4030" }
