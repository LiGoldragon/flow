[workspace]
members = ["crates/flow-defaults", "crates/flow-native", "crates/flow-ethos", "crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.40.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
flow-ethos = { path = "crates/flow-ethos", features = ["datom"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "a3e7383f14724a35cea2fb88c98fc90b00e4ef3d" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "34b164ef522e472aac181e5eae4a4030c48ee64b" }

# Signal and Meta-Signal also depend on flow-ethos by this Git source. Resolve
# those workspace edges to this exact leaf package so every shared nominal
# type has one Cargo package identity during the Flow workspace build.
[patch."https://github.com/LiGoldragon/flow"]
flow-ethos = { path = "crates/flow-ethos" }
