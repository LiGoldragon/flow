[workspace]
members = ["crates/flow-defaults", "crates/flow-ethos", "crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.25.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
flow-ethos = { path = "crates/flow-ethos", features = ["datom"] }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "a991c1499b201ad75a084a6542d2f110c46720ce" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "991859f5f121789c6966d542264baccafd000268" }
