[package]
name = "ethos-printout"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "A contract's Signal printed as one Ethos file, its imports resolved, with an example datom for each input and output."

[dependencies]
# The rev signal-flow generates its Rust with, the oldest reader of the
# contracts printed: one source of ethos-zero stands for both.
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "8c95310" }
