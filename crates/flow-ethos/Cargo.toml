[package]
name = "flow-ethos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead48b31e8d4f429d7fb156dd18548bbd79c1", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade34010cec6cec153ae694ee335f7fea0193", optional = true }
rkyv.workspace = true

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "07714b0171802787bea1eefe4caa2d826d9c4030" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
