[workspace]
members = ["crates/flow-defaults", "crates/flow-nexus", "crates/flow", "crates/flow-meta"]
resolver = "3"

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/flow"
publish = false

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
thiserror = "2"
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "2cc487923476e3c79899f1da48b03e250ae09c10" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "dd7b7df76ef84f6a1a2986388d084052951bb923" }
